#Bluetooth config -------------------
# central 側と同じ理由でこちらも無効にする……つもりだったが、【未解決】この設定は
# 実機には反映されない。詳細は CLine46_R.conf のコメントを参照。
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n

# central 側と同じ理由でウォッチドッグのフリーズ検出タイマーを減らす。
# 詳細は CLine46_R.conf の CONFIG_ZMK_WATCHDOG_FREEZE_MONITOR_LOWPRIO_QUEUE のコメントを参照。
CONFIG_ZMK_WATCHDOG_FREEZE_MONITOR_LOWPRIO_QUEUE=n

#Split config -------------------
# central 側（CLine46_R.conf）と対にする。ZMK_SPLIT_RELAY_EVENT は
# 「peripheral から central へイベントを中継する」機能で、左右両方の設定が要る。
# L 側に無いと peripheral が relay 用のキャラクタリスティックを公開しないため、
# DYA Studio の「周辺側」タブが Peripheral did not respond でタイムアウトする。
# DATA_LEN は R 側の 240 に合わせる（既定は 128）。
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240

# peripheral 側でもウォッチドッグを動かす。zmk-feature-watchdog の
# ZMK_WATCHDOG_SPLIT_RELAY は `default y if ZMK_SPLIT` かつ ZMK_SPLIT_RELAY_EVENT
# 依存だが、`if ZMK_WATCHDOG` の中にあるため ZMK_WATCHDOG 自体が要る。
# これが無いと DYA Studio の「周辺側 1」タブが、relay は通っても答える相手が
# いないためタイムアウトする。左手側のクラッシュ記録もこれで残るようになる。
# STUDIO_RPC は central 経由の relay で答えるので peripheral 側には不要
# （そもそも ZMK_STUDIO 依存なので peripheral では有効にできない）。
CONFIG_ZMK_WATCHDOG=y

# 応答の組み立てに central 側と同じスタックが要る。CLine46_R.conf の
# 「Increase stack size for low priority thread to prevent stack overflow when
# encoding large notification body for custom rpc」と同じ理由で、peripheral も
# 中継された要求に対して nanopb で応答を組み立てるため。
# これが無いと周辺側ウォッチドッグを開いたときに落ちる。
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

##for NiMH battery
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y

# optional
CONFIG_ZMK_NON_LIPO_MAX_MV=1360
CONFIG_ZMK_NON_LIPO_MIN_MV=1020
CONFIG_ZMK_NON_LIPO_LOW_MV=1000
#CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=60000
# 60 seconds